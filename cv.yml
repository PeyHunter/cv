experience:
  - title: "Final degree project: KAOS"
    org: Copenhagen School of Design and Technology (EK)
    place: Copenhagen
    start: 2026-11
    end: 2027-01 (expected)
    points:
      - "Building KAOS, an AI agent that runs as a Kubernetes operator and watches the cluster. When something breaks, it finds the cause and either fixes it itself or proposes a fix for a human to approve."
      - "It is woken by a schedule, an Alertmanager alert or a person, then reads logs (Loki), metrics (Prometheus) and what changed in the cluster (Pickle, cluster snapshots in Git)."
      - "Its memory is incidental, an event-sourced incident system in Rust and PostgreSQL (CloudNativePG). It groups repeat errors by signature, stores each guess at a cause with a confidence level and evidence, and tracks whether a fix stopped the error coming back."
      - "A policy lists the fixes the agent may make on its own. The project tests the agent's prompts and workflows so more fixes can safely move onto that list. Deployed with Helm, Nix and Argo CD."
  - title: AI Intern
    org: Droids Agency
    place: Copenhagen
    start: 2026-08
    end: 2026-11
    points:
      - "Bootstrapped a Kubernetes cluster with Argo CD (GitOps), cert-manager (automatic TLS certificates) and external-dns (automatic DNS records)."
      - "Helped build an OCR pipeline on Kubernetes that reads multilingual PDF documents."
      - "Built its benchmarks: test documents with correct answers, and WER/CER scores that measure how accurate the OCR is."
      - "Set up the local k3s deploy with an OCR smoke test, plus a mock ingester that sends in a test file every 30 seconds."
      - "Added a resend tool that sends one page crop to the AI model again and saves every reply in PostgreSQL."
      - Test automation with agentic Playwright.
      - Building AI workflows.

