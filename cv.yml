summary: >-
  Computer Science (Datamatiker) student at EK, looking for job opportunities.
  As an AI intern at Droids Agency I bootstrapped a Kubernetes cluster with
  Argo CD, cert-manager and external-dns. I also helped build an OCR pipeline
  on Kubernetes, where I made the accuracy benchmarks and the local k3s deploy
  workflow. I work with agentic Playwright testing and AI workflows, and run
  my own k3s cluster with GitOps and CI/CD. Hands-on experience with Java, Spring Boot and
  MySQL, plus frontend work in JavaScript, React and Tailwind. Before coding I
  spent years as a graphic designer, so I care about how things look and feel,
  not just how they work.

