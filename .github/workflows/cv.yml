name: CV

# push to main / pull request -> build and check, keep the files as a workflow artifact
# push a tag like v1.2.0      -> also: GitHub Release with cv.html + cv.pdf,
#                                container image, and deploy to cv.peytonhunter.com
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["README.md"]
  pull_request:

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push the image to ghcr.io

env:
  TYPST_VERSION: v0.15.1
  IMAGE: ghcr.io/peyhunter/cv

jobs:
  # ---------- Job 1: cv.yml -> cv.html + cv.pdf (+ release + image on tags) ----------
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Pick the version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="$GITHUB_REF_NAME"; else v="sha-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install Typst ${{ env.TYPST_VERSION }}
        run: |
          curl -sSfL "https://github.com/typst/typst/releases/download/${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | sudo tar -xJ --strip-components=1 -C /usr/local/bin typst-x86_64-unknown-linux-musl/typst
          typst --version

      - name: Build cv.html and cv.pdf
        run: ./build.sh "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v7
        with:
          name: cv-${{ steps.version.outputs.version }}
          path: dist/

      - name: Publish the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/cv.html dist/cv.pdf \
            --title "CV $GITHUB_REF_NAME" --generate-notes

      - uses: docker/setup-buildx-action@v4
        if: github.ref_type == 'tag'

      - name: Log in to ghcr.io
        if: github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        if: github.ref_type == 'tag'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest

  # ---------- Job 2: tell the cluster repo about the new version ----------
  deploy:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.build.outputs.version }}
    steps:
      - name: Check out the cluster repo
        uses: actions/checkout@v7
        with:
          repository: PeyHunter/k3s-gitops
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}

      - name: Point the CV at the new image
        run: |
          sed -i -E "s|newTag: .*|newTag: \"${TAG}\"|" cv/kustomization.yaml
          grep newTag cv/kustomization.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv/kustomization.yaml
          git diff --cached --quiet && { echo "Already on ${TAG}"; exit 0; }
          git commit -m "cv: deploy ${TAG}"
          git push
